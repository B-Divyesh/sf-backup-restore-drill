[package]
name = "restore-drill"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Prove that selected backup files can actually be restored"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-backup-restore-drill"
readme = "README.md"
keywords = ["backup", "restore", "verification", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"
toml = "0.9.5"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
